## Passos obrigatórios

1. Analise as tarefas indicadas.
- Confira IDs, dependências, situação real do código, RFs/RNs, critérios de aceite e casos de borda.
- Mostre os caminhos do Blueprint e do FRD usados e a skill escolhida.
- Se não houver IDs nem seleção inequívoca, peça quais tarefas o usuário deseja; não inicie implementação nem assuma execução do Blueprint inteiro.
- Se um pré-requisito estiver pendente, sinalize sem implementá-lo por conta própria.

2. Apresente um plano detalhado, sem código de implementação.
- Liste arquivos a criar/modificar e a responsabilidade de cada alteração.
- Explique abordagem, regras, estados, falhas, compatibilidade, ordem e testes aplicáveis.
- No hardening, mostre também a diferença entre especificação e código, o que precisa ser garantido e o resultado esperado quando a regra não for satisfeita.
- Aguarde aprovação explícita do usuário antes de editar código, schema, testes ou configuração funcional. Criar este agente, selecionar uma tarefa ou aprovar o Blueprint não equivale a aprovar o plano de implementação da tarefa.
- Se atuar como subagente, devolva o plano ao agente principal com status aguardando aprovação. Só implemente quando ele encaminhar a aprovação explícita do usuário para esse plano. Não repita a solicitação quando a aprovação já estiver documentada no contexto.

3. Após aprovação, implemente seguindo as tarefas definidas.
- Execute apenas o escopo aprovado e escreva testes junto das alterações.
- Preserve padrões e separação de UI, domínio e dados.
- Não avance automaticamente para tarefas seguintes.
- Se precisar mudar escopo ou uma decisão aprovada, explique o ajuste e aguarde decisão do usuário.
- Não crie outros agentes nem distribua trabalho em paralelo por iniciativa própria.

4. Execute compilação e verificação do funcionamento.
- Use o Gradle Wrapper no PowerShell a partir da raiz do checkout:
  .\gradlew.bat testDebugUnitTest
  .\gradlew.bat assembleDebug
  .\gradlew.bat connectedDebugAndroidTest
  git diff --check
- Execute testes unitários, integração e E2E de endpoints/frontend conforme o escopo da tarefa e as dependências disponíveis.
- Neste app não há endpoints próprios: não crie backend para cumprir o checklist. Teste a integração ViaCEP com respostas controladas e o frontend Android com instrumentação quando aplicável. Informe se transporte HTTP real ou disponibilidade pública não foram verificados.
- Migrações exigem teste com SQLite/Room real; teste unitário de texto SQL não é evidência suficiente. Preserve o isolamento dos bancos de teste.
- Testes de banco/UI dependem de dispositivo ou emulador. Verifique disponibilidade e registre impedimentos; não declare aprovação do que não foi executado.
- Quando o E2E completo depender de tarefas futuras, execute as verificações possíveis e registre a cobertura pendente e a tarefa correspondente.
- Corrija falhas do escopo aprovado antes de concluir; não altere requisitos para fazer testes passarem. Não reintroduza TTL para satisfazer teste obsoleto.
- Para mudanças apenas documentais, revise consistência, caminhos e git diff --check; build Android não é necessário.

5. Entregue evidências e status.
- Informe tarefas concluídas, arquivos alterados, RFs/RNs atendidos, comandos/resultados, limitações, desvios e tarefas desbloqueadas.
- Não declare uma tarefa integralmente validada se verificações obrigatórias ficaram pendentes.
- Não execute tarefas desbloqueadas sem nova seleção do usuário.
- Mantenha relatórios em docs/consulta-cep/.
- Preserve docs/consulta-cep/hardening-consulta-cep.md como registro histórico. Para novo hardening, use relatório por tarefa/grupo, por exemplo hardening-consulta-cep-t002.md ou hardening-consulta-cep-t002-t004.md. Nunca sobrescreva a validação histórica com resultados atuais.

## Restrições funcionais e técnicas

- Entrada somente por CEP; preservar máscara, mensagens, telas XML, ViewBinding e navegação.
- Validar/normalizar antes de consultar dados. Room primeiro, sem expiração; API somente após ausência local confirmada. Erro de leitura não é miss.
- Sucesso remoto inclui armazenamento. Todo sucesso, inclusive local, registra recência; abrir lista/restaurar não registra consulta.
- Preservar um registro por CEP, dados existentes, migrações compatíveis e atomicidade de endereço/recência. Sem migração destrutiva.
- Falhas preservam entrada, histórico e endereço anterior identificado pelo seu próprio CEP; não associar o endereço anterior ao CEP que falhou.
- Não acrescentar mutex, serialização, guardas extras contra consultas simultâneas, segunda leitura defensiva antes de inserir ou testes de consultas simultâneas.
- Preservar campo/botão bloqueados durante Loading e proteção específica contra restauração inicial atrasada sobrescrever pesquisa.
- Propagar CancellationException. Não acrescentar estados, transições, mensagens ou validações por precaução.
- Domínio livre de Android, Retrofit e Room. UI não acessa DAO/API diretamente. Manter composição manual, sem framework novo de DI.
- Sem novos campos visuais, telas, exclusão, atualização manual/em segundo plano ou aviso de cache.
- Não atualizar stack, dependências, SDK ou ferramentas sem necessidade do escopo aprovado.

